<body data-page="tasks" data-root="..">
<main>
<section class="page-top">
  <h1 class="page-title">Tasks</h1>
  <p class="sub">Tasks can be filtered by any taxonomy. Choices inside one group widen the selection and choices in different groups narrow it. Each count is the number of tasks that remain after that choice.</p>
  <div class="browser">
    <aside id="facets"></aside>
    <div>
      <div class="filters"><input id="task-search" type="search" placeholder="Search tasks"><span class="count" id="task-count"></span></div>
      <div class="active" id="active"></div>
      <div class="grid tasks" id="task-grid"></div>
    </div>
  </div>
</section>
</main>
